# Local stack: MongoDB + auth-service.
#   Mongo only : docker compose up -d mongo     (then run the app from your IDE / mvn spring-boot:run)
#   Everything : docker compose up -d --build   (generate the keystore first: scripts/generate-keystore.sh)
services:
  mongo:
    image: mongo:7.0
    container_name: auth-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: authdb
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  auth-service:
    build: .
    container_name: auth-service
    depends_on:
      - mongo
    ports:
      - "8443:8443"
    environment:
      MONGODB_URI: mongodb://auth_app:auth_app_password@mongo:27017/authdb?authSource=authdb
      JWT_SECRET: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLTEyMzQ1Njc4OTA=
      SSL_KEYSTORE_PASSWORD: changeit
    profiles:
      - app

volumes:
  mongo-data:
