kafka.bootstrap.servers=localhost:9092
kafka.retries=3
kafka.acks=all
kafka.batch.size=1600
kafka.linger.ms=1
kafka.buffer.memory=33554432
kafka.autoOffsetReset=latest
kafka.processingGuarantee=exactly_once
kafka.threads=8
kafka.topic.name=testing
kafka.topic.noOfPartitions=10
kafka.topic.noOfReplication=3
kafka.client.id=b2c
zookeeper.url=localhost:2181
zookeeper.sessionTimeOutInMs=15000
zookeeper.connectionTimeOutInMs=10000
######## Authenication ########
kafka.jaas.path=/home/centos/kerberosTest/centos_client2_jaas.conf


##### MongoDB Atlas (used by MongoDBConnectionFactory) #######
# Set MONGO_URI env var, e.g. mongodb+srv://zeroxvm:<password>@zeroxvm.n6ojx.mongodb.net/admin?retryWrites=true&w=majority
mongo.uri=${MONGO_URI}
mongo.appDatabaseName=zeroxvmDB

##### MySQL - DataSource (HikariCP, created by Spring Boot auto-configuration) #####
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=mysql_HIKARI_VENDOR
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
# MySQL Connector/J tuning (HikariCP recommended settings)
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useSSL=false

##### JPA / Hibernate - every spring.jpa.properties.* key is passed to Hibernate as-is (see JpaConfig) #####
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
# validate | update | create | create-drop | none
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
