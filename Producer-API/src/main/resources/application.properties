========== Https Configs ==============
server.ssl.key-store-type=PKCS12
# The path to the keystore containing the certificate
server.ssl.key-store=classpath:keystore/zeroxvm.p12
# The password used to generate the certificate
server.ssl.key-store-password=Zeroxvm@180984
# The alias mapped to the certificate
server.ssl.key-alias=zeroxvm-local
server.ssl.enabled=true
# Only TLS 1.2 / 1.3 - SSLv3, TLS 1.0 and TLS 1.1 are insecure (POODLE/BEAST) and rejected
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
# Forward-secret AEAD suites only; Tomcat skips any the running JDK does not support
server.ssl.ciphers=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

